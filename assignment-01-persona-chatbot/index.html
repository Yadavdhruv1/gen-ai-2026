<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Persona-Based AI Chatbot — Talk to Scaler personalities Anshuman Singh, Abhimanyu Saxena, and Kshitij Mishra.">
    <title>ScalerChat — Persona-Based AI Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="ambient-bg">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
        </div>

        <header class="app-header">
            <div class="header-left">
                <div class="logo">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                        <rect width="28" height="28" rx="8" fill="url(#logo-grad)"/>
                        <path d="M8 14C8 10.686 10.686 8 14 8C17.314 8 20 10.686 20 14" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                        <circle cx="14" cy="18" r="2" fill="white"/>
                        <defs><linearGradient id="logo-grad" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
                    </svg>
                    <h1>ScalerChat</h1>
                </div>
                <span class="header-badge">Gen AI Assignment 01</span>
            </div>
            <div class="header-right">
                <div class="active-persona-badge" id="activePersonaBadge">
                    <span class="active-dot"></span>
                    <span id="activePersonaName">Anshuman Singh</span>
                </div>
            </div>
        </header>

        <main class="main-content">
            <nav class="persona-switcher" id="personaSwitcher">
                <button class="persona-tab active" data-persona="anshuman" id="tab-anshuman">
                    <div class="persona-avatar" style="background: linear-gradient(135deg, #6366f1, #818cf8);">AS</div>
                    <div class="persona-info">
                        <span class="persona-name">Anshuman Singh</span>
                        <span class="persona-role">Co-founder, Scaler</span>
                    </div>
                </button>
                <button class="persona-tab" data-persona="abhimanyu" id="tab-abhimanyu">
                    <div class="persona-avatar" style="background: linear-gradient(135deg, #f59e0b, #f97316);">AX</div>
                    <div class="persona-info">
                        <span class="persona-name">Abhimanyu Saxena</span>
                        <span class="persona-role">Co-founder, Scaler</span>
                    </div>
                </button>
                <button class="persona-tab" data-persona="kshitij" id="tab-kshitij">
                    <div class="persona-avatar" style="background: linear-gradient(135deg, #10b981, #34d399);">KM</div>
                    <div class="persona-info">
                        <span class="persona-name">Kshitij Mishra</span>
                        <span class="persona-role">Head of Instructors</span>
                    </div>
                </button>
            </nav>

            <div class="chat-container">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="typing-indicator" id="typingIndicator">
                    <div class="typing-avatar" id="typingAvatar">AS</div>
                    <div class="typing-dots"><span></span><span></span><span></span></div>
                    <span class="typing-text">is thinking...</span>
                </div>
                <div class="suggestion-chips" id="suggestionChips"></div>
                <div class="chat-input-area">
                    <div class="input-wrapper">
                        <textarea id="messageInput" placeholder="Ask something..." rows="1" maxlength="2000"></textarea>
                        <button class="send-btn" id="sendBtn" disabled>
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 10L17 3L10 17L9 11L3 10Z" fill="currentColor"/></svg>
                        </button>
                    </div>
                    <p class="input-hint">Press <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line</p>
                </div>
            </div>
        </main>

        <div class="toast-container" id="toastContainer"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
